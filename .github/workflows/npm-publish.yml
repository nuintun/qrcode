name: Publish to npm
on:
  # 手动触发
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v7
      # 设置 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
      # 设置 Node.js
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          package-manager-cache: false
      # 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 发布到 npm
      - name: Publish to npm
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true
